<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Website Scanner | CyberShield</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Main CSS -->

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark cyber-nav">

    <div class="container">

        <a class="navbar-brand glow-text"
           href="/dashboard">

            <i class="fa-solid fa-shield-halved"></i>
            CyberShield

        </a>

        <div>

            <a href="/dashboard"
               class="btn btn-outline-light">

                Dashboard

            </a>

        </div>

    </div>

</nav>

<!-- SCANNER SECTION -->

<section class="scanner-section">

    <div class="container">

        <div class="scanner-box">

            <!-- TITLE -->

            <h1 class="glow-text text-center">

                <i class="fa-solid fa-radar"></i>
                Website Threat Scanner

            </h1>

            <!-- DESCRIPTION -->

            <p class="text-center text-light mt-3">

                Analyze suspicious URLs and detect phishing attacks,
                fake login portals, malware domains,
                and dangerous websites in real time.

            </p>

            <!-- INPUT -->

            <div class="scan-form mt-5">

                <input type="text"
                       id="urlInput"
                       class="form-control cyber-input"
                       placeholder="https://example.com">

                <div class="text-center">

                    <button onclick="scanWebsite()"
                            class="btn btn-cyber mt-4">

                        <i class="fa-solid fa-magnifying-glass"></i>
                        Scan Website

                    </button>

                </div>

            </div>

            <!-- LOADER -->

            <div id="loader"
                 class="loader text-center mt-5"
                 style="display:none;">

                <div class="spinner-border text-info"></div>

                <p class="mt-3 glow-text">

                    Initializing Threat Analysis...

                </p>

            </div>

            <!-- RESULT -->

            <div id="resultBox"
                 class="result-box mt-5">

            </div>

        </div>

    </div>

</section>

<!-- FOOTER -->

<footer class="footer">

    <div class="container text-center">

        CYBERSHIELD SECURED // REAL-TIME URL THREAT MONITOR ACTIVE

    </div>

</footer>

<!-- SCRIPT -->

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
