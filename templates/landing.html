<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CyberShield</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* ===== GLOBAL ===== */
body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Segoe UI', sans-serif;
    scroll-behavior: smooth;
}

/* ===== VIDEO BACKGROUND ===== */
.video-bg {
    position: fixed;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -3;
}

/* ===== DARK OVERLAY ===== */
.overlay {
    position: fixed;
    width: 100%;
    height: 100%;

    background: radial-gradient(
        circle at center,
        rgba(0, 0, 0, 0.4) 0%,
        rgba(0, 0, 0, 0.75) 60%,
        rgba(0, 0, 0, 0.95) 100%
    );

    z-index: -2;
}
/* ===== HERO ===== */
.hero {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
    animation: fadeIn 1.5s ease;
}

.hero h1 {
    font-size: 4rem;
    color: #00f7ff;
    text-shadow: 0 0 20px #00f7ff;
}

.hero p {
    opacity: 0.8;
    margin-top: 10px;
}

/* ===== BUTTON ===== */
.btn-cyber {
    margin-top: 20px;
    padding: 12px 30px;
    background: #00f7ff;
    border: none;
    color: black;
    font-weight: bold;
    transition: 0.3s;
}

.btn-cyber:hover {
    box-shadow: 0 0 20px #00f7ff;
    transform: scale(1.05);
}
.hero h1 {
    font-size: 4rem;
    color: #00f7ff;
    text-shadow: 
        0 0 10px #00f7ff,
        0 0 20px #00f7ff,
        0 0 40px rgba(0, 247, 255, 0.7);
}

.hero p {
    opacity: 1;
    font-size: 1.2rem;
    color: #ddd;
    text-shadow: 0 0 10px rgba(0,0,0,0.8);
}

/* ===== ANIMATION ===== */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(30px);}
    to {opacity: 1; transform: translateY(0);}
}

</style>
</head>

<body>

<!-- VIDEO -->
<video autoplay muted loop playsinline class="video-bg">
    <source src="{{ url_for('static', filename='videos/bg.mp4') }}" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- HERO -->
<section class="hero">
    <div>
        <h1>CyberShield</h1>
        <p>AI-Powered Phishing Detection & Web Security</p>
        <a href="/login" class="btn btn-cyber">Get Started</a>
    </div>
</section>

</body></html>
